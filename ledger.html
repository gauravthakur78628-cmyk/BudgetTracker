<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app-screen" class="screen">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">📒</span>
        <span class="brand-name">Ledger</span>
      </div>
      <div class="header-right">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="link-btn">Sign out</button>
      </div>
    </header>

    <main class="app-main">
      <section class="summary-row">
        <div class="summary-card">
          <span class="summary-label">Income</span>
          <span class="summary-value income" id="sum-income">$0.00</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">Expenses</span>
          <span class="summary-value expense" id="sum-expense">$0.00</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">Balance</span>
          <span class="summary-value" id="sum-balance">$0.00</span>
        </div>
      </section>

      <section class="entry-panel">
        <h2 class="panel-title">Add an entry</h2>
        <form id="entry-form" class="entry-form">
          <label class="field">
            <span>Description</span>
            <input type="text" id="entry-desc" placeholder="Groceries, paycheck, rent…" required />
          </label>
          <label class="field field-amount">
            <span>Amount</span>
            <input type="number" id="entry-amount" step="0.01" min="0" placeholder="0.00" required />
          </label>
          <label class="field field-type">
            <span>Type</span>
            <select id="entry-type">
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </label>
          <label class="field field-category">
            <span>Category</span>
            <select id="entry-category">
              <option>Food</option>
              <option>Housing</option>
              <option>Transport</option>
              <option>Utilities</option>
              <option>Health</option>
              <option>Fun</option>
              <option>Income</option>
              <option>Other</option>
            </select>
          </label>
          <label class="field field-date">
            <span>Date</span>
            <input type="date" id="entry-date" required />
          </label>
          <button type="submit" class="btn-primary" id="entry-submit">Add entry</button>
        </form>
      </section>

      <section class="chart-panel">
        <h2 class="panel-title">Income vs. expenses, last 6 months</h2>
        <div id="chart-empty" class="ledger-empty" hidden>
          Add a few entries to see your trend here.
        </div>
        <div class="chart-wrap">
          <canvas id="trend-chart" height="260"></canvas>
        </div>
      </section>

      <section class="ledger-panel">
        <div class="panel-heading-row">
          <h2 class="panel-title">Entries</h2>
          <span id="entry-count" class="entry-count"></span>
        </div>
        <div id="ledger-empty" class="ledger-empty" hidden>
          Nothing recorded yet. Add your first entry above.
        </div>
        <table class="ledger-table" id="ledger-table" hidden>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th class="col-amount">Amount</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="ledger-body"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="ledger.js"></script>
</body>
</html>
